<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar punto de ayuda — Voluntariado Bogotá</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Registrá tu fundación o punto de acopio</h1>
      <p class="app-subtitle">
        Para fundaciones, líderes sociales o puntos que necesiten voluntarios o donaciones.
        <a href="/index.html">Volver al mapa</a>
      </p>
    </header>

    <main class="form-page">
      <p class="form-notice">
        Tu registro queda <strong>pendiente de revisión</strong> antes de aparecer públicamente en el mapa.
      </p>

      <form id="fundacion-form" class="form" novalidate>
        <label class="form-honeypot" aria-hidden="true">
          <span>Dejar en blanco</span>
          <input type="text" name="sitio_web" tabindex="-1" autocomplete="off" />
        </label>

        <label class="form-field">
          <span>Nombre de la organización o lugar *</span>
          <input type="text" name="nombre_organizacion" required maxlength="200" />
        </label>

        <label class="form-field">
          <span>Dirección *</span>
          <input type="text" name="direccion" required maxlength="300" placeholder="Calle 26 #62-47, Bogotá D.C" />
        </label>

        <label class="form-field">
          <span>Localidad</span>
          <input type="text" name="localidad" maxlength="100" placeholder="Engativá, Kennedy, Suba..." />
        </label>

        <label class="form-field">
          <span>¿Necesitan voluntarios? *</span>
          <select name="necesita_voluntarios" required>
            <option value="si">Sí</option>
            <option value="no" selected>No</option>
            <option value="revisando">Revisando información</option>
          </select>
        </label>

        <label class="form-field form-field--checkbox">
          <input type="checkbox" name="necesita_donaciones" value="true" />
          <span>Necesitan donaciones</span>
        </label>

        <label class="form-field">
          <span>¿Qué tipo de donaciones?</span>
          <input type="text" name="tipo_donaciones" maxlength="300" placeholder="Alimentos, ropa, agua, artículos para mascotas..." />
        </label>

        <label class="form-field">
          <span>Horarios</span>
          <input type="text" name="horarios" maxlength="200" placeholder="Lunes a viernes 8am-4pm" />
        </label>

        <label class="form-field">
          <span>Nombre de contacto</span>
          <input type="text" name="contacto_nombre" maxlength="150" />
        </label>

        <label class="form-field">
          <span>Teléfono / WhatsApp de contacto</span>
          <input type="tel" name="contacto_telefono" maxlength="50" />
        </label>

        <label class="form-field">
          <span>Instagram</span>
          <input type="url" name="instagram" maxlength="300" placeholder="https://instagram.com/..." />
        </label>

        <label class="form-field">
          <span>Link de inscripción para voluntarios</span>
          <input type="url" name="link_inscripcion" maxlength="500" />
        </label>

        <label class="form-field">
          <span>Notas</span>
          <textarea name="notas" rows="4" maxlength="3000"></textarea>
        </label>

        <button type="submit" class="form-submit">Enviar registro</button>
        <p id="fundacion-status" class="form-status" role="status"></p>
      </form>
    </main>

    <script type="module" src="/src/pages/fundacion.ts"></script>
  </body>
</html>
